experiment:
  hypothesis: A compact CNN establishes a reproducible image-classification baseline.
  change_type: baseline
  expected_improvement: Establish a held-out classification accuracy reference.
  estimated_gpu_hours: 1
  rollback_plan: Retain the frozen baseline when later changes underperform.

data:
  version: replace-with-data-version
  train_images_dir: data/raw/train
  test_images_dir: data/raw/test
  image_size: [128, 128]
  validation_fraction: 0.2
  id_column: id
  prediction_column: label

model:
  base_channels: 16
  dropout: 0.1

training:
  runner: image_classification
  seed: 42
  epochs: 20
  batch_size: 16
  num_workers: 0
  device: cpu

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0

validation:
  metric: accuracy
  direction: maximize
