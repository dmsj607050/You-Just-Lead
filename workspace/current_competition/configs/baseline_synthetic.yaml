experiment:
  hypothesis: Establish a deterministic workflow baseline before task adaptation.
  change_type: baseline
  expected_improvement: Establish a valid reference score.
  estimated_gpu_hours: 0
  rollback_plan: Keep this configuration unchanged as the baseline.

data:
  version: synthetic-v1
  synthetic_samples: 256
  synthetic_features: 8
  synthetic_label_noise: 0.25

model:
  hidden_dim: 16

training:
  runner: synthetic_binary_classification
  seed: 42
  epochs: 8
  batch_size: 32
  device: cpu

optimizer:
  name: adamw
  learning_rate: 0.01

validation:
  metric: accuracy
  direction: maximize
