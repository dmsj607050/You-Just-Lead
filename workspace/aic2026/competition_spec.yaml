competition:
  name: 面向城市场景的视觉多模态目标检测
  platform: www.aicomp.cn（报名官网）
  task_type: object_detection
  deadline: 规则文档未记载具体日期
  rule_profile: aic_multimodal_detection
evaluation:
  primary_metric: mAP@50-95
  direction: maximize
  public_private_split: null
submission:
  format: zip archive of per-image TXT prediction files
  filename_rule: <image_stem>.txt
  required_columns: []
  id_column: null
  expected_rows: null
  daily_limit: 规则文档未记载提交次数
  contract:
    line_columns:
    - class_id
    - norm_center_x
    - norm_center_y
    - norm_w
    - norm_h
    - confidence
    per_image_file: one TXT per test image, named with the image stem
    empty_file_required: true
    max_boxes_per_image: 100
    package_layout: all per-image TXT files in one archive
    coordinate_space: normalized to the original image size, range 0~1
constraints:
  external_data_allowed: false
  pretrained_models_allowed: true
  ensemble_allowed: false
  inference_time_limit_seconds: null
  model_size_limit_mb: 规则文档未记载上限
  offline_only: true
  test_data_reuse_allowed: false
