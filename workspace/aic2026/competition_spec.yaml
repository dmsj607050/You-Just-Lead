    fields:
      competition.name: 第 1 页页眉与标题「全球校园人工智能算法精英大赛·算法挑战赛·面向城市场景的视觉多模态目标检测」
      competition.platform: 十五、联系方式「报名官网：www.aicomp.cn」；规则文档未单独指明在线提交平台
      competition.task_type: 三、赛题任务「要求参赛者设计并实现一种基于可见光、热红外与深度三模态数据融合的目标检测算法」
      competition.deadline: 十三、提交要求只按初赛/复赛/半决赛/总决赛列出提交物，全文未出现任何起止日期
      evaluation.primary_metric: 六、性能指标要求「本赛题使用经典目标检测性能指标 mAP@50-95 来评估提交方法的有效性」
      evaluation.direction: 九（三）成绩计算「依据性能评估指标 mAP@50-95 进行打分」；注「低于赛事方公布的基线成绩…有权认定为无效成绩」
      submission.format: 九（二）输出数据格式要求「最终将所有 TXT 文件打包为压缩包进行提交」
      submission.filename_rule: 九（二）「每张测试图必须提交一个同名的预测 TXT 文件」
      submission.daily_limit: 十三、提交要求与九、成绩评价均未记载每日提交次数或提交次数上限
      constraints.model_size_limit_mb: 十三（二）「训练好的模型文件（由于模型可能较大，请提供模型下载链接）」；未记载模型体积上限
      data.modalities: 九（一）输入数据格式要求「参赛者算法应能正确读取赛题数据，包括 RGB 图像、Infrared 图像与 Depth 图像」
      data.class_count: 三（一）「数据集中总共包含从"0"开始编号的 12 个类别…分别编号为：0 person … 11 tricycle」
      data.label_format: 三（二）数据集标签说明「目标在图像中的标签为对应目标的矩形边界框，格式为 [class_id, norm_center_x,
        norm_center_y, norm_w, norm_h]」
      submission.contract.line_columns: 九（二）「文件中每一行表示一个目标在图像中的位置、置信度和类别信息：[class_id，norm_center_x,
        norm_center_y，norm_w，norm_h，confidence]」
      submission.contract.per_image_file: 九（二）「每张测试图必须提交一个同名的预测 TXT 文件」
      submission.contract.empty_file_required: 九（二）「若某张图未检测到目标，也须提交一个空 TXT 预测文件，不允许缺失」
      submission.contract.max_boxes_per_image: 九（二）「每张图最大预测框数量为 100，超过数量会按置信度截断」
      submission.contract.package_layout: 九（二）「最终将所有 TXT 文件打包为压缩包进行提交」
      submission.contract.coordinate_space: 三（二）「norm_center_x 表示目标框中心点在图像宽度方向的位置，经过归一化处理后的值（取值范围为
        0~1）」等四句
      constraints.offline_only: 十一（一）算法约束「禁止调用任何在线服务或 API，所有训练与推理须可在本地离线完成」
      constraints.external_data_allowed: 十一（二）数据使用约束「参赛者仅可使用赛事官方提供的训练数据集，严禁私自扩充外部数据」
      constraints.pretrained_models_allowed: 十一（二）「允许使用 ImageNet、COCO、Objects365 等公开预训练权重」
      constraints.ensemble_allowed: 十一（一）「禁止将多个不同结构或训练阶段的模型进行简单集成，直接采用投票法、平均法等方式决策」
      constraints.test_data_reuse_allowed: 十一（二）「严禁私自对测试集进行标注、篡改，严禁将测试集数据用于模型训练环节」
  approved_at: '2026-09-24T08:55:21+00:00'
